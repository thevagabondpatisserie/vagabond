<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Be+Vietnam+Pro:wght@300;400;500&family=JetBrains+Mono&display=swap">
<style>
:root{--ink:#0d0e0f;--ink2:#151718;--paper:#ebe8e1;--mute:#8e9297;--line:#272a2e;--butter:#cdb98a;--warn:#d98b6a;
--fd:"Cormorant Garamond",serif;--fb:"Be Vietnam Pro",sans-serif;--fm:"JetBrains Mono",monospace}
*{box-sizing:border-box;margin:0}
body{background:#070808;color:var(--paper);font:300 14px/1.5 var(--fb);-webkit-font-smoothing:antialiased}
.lab{font:400 10.5px/1.2 var(--fm);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.lab b{color:var(--butter);font-weight:400}
.mob{width:390px;height:844px;background:var(--ink);position:relative;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;padding:54px 18px 12px;border-bottom:1px solid var(--line)}
.mark{font:400 22px var(--fd)}
.ava{width:44px;height:44px;border-radius:50%;background:var(--butter);color:var(--ink);display:grid;place-items:center;font:500 14px var(--fb)}
.hi{padding:22px 18px 6px;display:grid;gap:6px}
.hi h1{font:300 34px/1.05 var(--fd)}
.hi h1 em{color:var(--butter)}
.list{padding:10px 18px;display:grid;gap:14px}
.c{display:grid;grid-template-columns:112px 1fr;gap:14px;padding:12px;border:1px solid var(--line);background:var(--ink2)}
.t{width:112px;height:84px;overflow:hidden;position:relative}
.t svg{width:100%;height:100%;display:block}
.t svg text[letter-spacing="1.2"]{display:none}
.b{display:grid;gap:6px;align-content:start;min-width:0}
.b h3{font:400 19px/1.12 var(--fd)}
.pg{height:2px;background:var(--line);position:relative;margin-top:2px}
.pg i{position:absolute;left:0;top:0;height:100%;background:var(--butter)}
.meta{display:flex;justify-content:space-between;font:400 10.5px var(--fm);letter-spacing:.06em;color:var(--mute)}
.go{grid-column:1/-1;display:flex;align-items:center;justify-content:center;min-height:48px;font:400 12px var(--fm);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--paper);background:var(--paper);color:var(--ink)}
.go.o{background:transparent;color:var(--paper)}
.exp .t{filter:grayscale(1) brightness(.55)}
.exp .b h3{color:var(--mute)}
.chip{justify-self:start;font:400 10px var(--fm);letter-spacing:.1em;text-transform:uppercase;padding:4px 7px;border:1px solid}
.chip.ok{color:var(--butter);border-color:rgba(205,185,138,.4)}
.chip.no{color:var(--warn);border-color:rgba(217,139,106,.45)}
.go.w{background:var(--butter);border-color:var(--butter);color:var(--ink)}
.tab{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--ink);padding-bottom:22px}
.tab a{min-height:56px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mute)}
.tab a.on{color:var(--paper);box-shadow:inset 0 2px 0 var(--butter)}
</style></head><body>
<div class="mob" id="mob">
  <div class="top"><span class="mark">Sonneto</span><span class="ava">L</span></div>
  <div class="hi"><span class="lab">Khoá của tôi</span><h1>Chào Lan, <em>học tiếp nhé.</em></h1></div>
  <div class="list">
    <div class="c"><div class="t" data-t="croissant"></div>
      <div class="b"><span class="chip ok">Còn 142 ngày</span><h3>Croissant và viennoiserie</h3><div class="pg"><i style="width:31%"></i></div><div class="meta"><span>4 / 12 BÀI</span><span>31%</span></div></div>
      <a class="go">Học tiếp bài 4</a></div>
    <div class="c"><div class="t" data-t="giavon"></div>
      <div class="b"><span class="chip ok">Còn 23 ngày</span><h3>Tính giá vốn cho bếp bánh</h3><div class="pg"><i style="width:83%"></i></div><div class="meta"><span>5 / 6 BÀI</span><span>83%</span></div></div>
      <a class="go o">Học tiếp bài 6</a></div>
    <div class="c exp"><div class="t" data-t="entremets"></div>
      <div class="b"><span class="chip no">Hết hạn 02/10/2026</span><h3>Entremets</h3><div class="pg"><i style="width:60%;background:var(--mute)"></i></div><div class="meta"><span>6 / 10 BÀI</span><span>GIỮ TIẾN ĐỘ</span></div></div>
      <a class="go w">Gia hạn 6 tháng</a></div>
  </div>
  <nav class="tab"><a class="on">Khoá của tôi</a><a>Tất cả khoá</a><a>Tài khoản</a></nav>
</div>
<script src="thumbs.js"></script>
<script>document.querySelectorAll('[data-t]').forEach(function(e){e.innerHTML=THUMBS[e.dataset.t]})</script>
</body></html>

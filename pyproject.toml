[project]
name = "vagabond"
authors = [{ name = "Cong ty TNHH Patisserie Vagabond", email = "thevagabondbakery@gmail.com" }]
description = "Cong dat banh online cua The Vagabond Patisserie: noi Frappe voi Pancake POS, Goong va Ahamove."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = ["requests>=2.31.0"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]

# Frappe Cloud doc muc nay de biet app chay duoc voi ban Frappe nao.
# Thieu no thi bao "Could not find compatible Frappe version in pyproject.toml".
[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"

[project]
name = "vagabond"
authors = [{ name = "Cong ty TNHH Patisserie Vagabond", email = "thevagabondbakery@gmail.com" }]
description = "Cong dat banh online cua The Vagabond Patisserie: noi Frappe voi Pancake POS, Goong va Ahamove."
# DUNG CHAN TREN. Ngay 01/09/2026 da thu dat ">=3.10,<3.14" va deploy hong
# ngay voi dong: "vagabond requires Python version >=3.10,<3.14, found version
# is 3.14". May dung anh cua Frappe Cloud CHAY PYTHON 3.14, va no doc dong nay
# de chon ban Python dem di bien dich thu ca thu muc app o buoc "Run
# Validations - Pre-build". Ha tran xuong duoi 3.14 la tu chan chinh minh.
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
# pywebpush keo theo py_vapid, http_ece va cryptography - du bo de ky VAPID
# va ma hoa than tin theo dung chuan Web Push. Them tu v243, lop hai cua
# thong_bao.py.
# PyMuPDF de doi tung trang PDF dinh kem thanh anh, xem _pdf_ra_anh trong
# ho_so_tt.py. Chon PyMuPDF chu khong phai pdf2image vi pdf2image con phai co
# binary poppler cua he dieu hanh, thuong vang mat tren anh Docker Frappe
# Cloud. PyMuPDF la banh xe thuan, cai la chay.
#
# Code khong bat buoc phai co no: thieu thi _pdf_ra_anh tra ve rong va bo ho
# so quay ve duong cu la noi ca tep PDF vao cuoi. Khai o day de may co, chu
# khong phai de code song chet theo no.
dependencies = ["requests>=2.31.0", "pywebpush>=1.14.0", "PyMuPDF>=1.24.0"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]

# Frappe Cloud doc muc nay de biet app chay duoc voi ban Frappe nao.
# Thieu no thi bao "Could not find compatible Frappe version in pyproject.toml".
[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"

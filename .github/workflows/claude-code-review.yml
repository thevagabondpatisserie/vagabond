# Keep this check name, but do not launch a second paid review on synchronize.
name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
permissions:
  contents: read
jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --test .github/agent-control/gate.test.cjs
      - name: Review is a separate release gate
        run: echo 'This check tests proposed PR code, not the default-branch gate currently executing. Require independent review on the final head/base before merge; green here is not Claude approval.' >> "$GITHUB_STEP_SUMMARY"

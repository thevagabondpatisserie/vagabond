name: Codex issue inbox
on:
  pull_request:
    paths:
      - ".github/codex-issue-inbox/**"
      - ".github/workflows/codex-issue-inbox.yml"
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
# Every invocation reconciles the durable issue sources, not only its event.
# Thus a coalesced pending run cannot lose an earlier request.
concurrency:
  group: codex-issue-inbox-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'receiver' }}
  cancel-in-progress: false
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/codex-issue-inbox -v
  receive:
    permissions:
      contents: read
      issues: write
    if: >-
      vars.CODEX_INBOX_ENABLED == 'true' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name != 'pull_request' && github.event.issue.pull_request == null && github.event.sender.type == 'User'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Receive and reconcile requests (no model)
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_INBOX_SINCE: ${{ vars.CODEX_INBOX_SINCE }}
        run: python3 .github/codex-issue-inbox/inbox.py

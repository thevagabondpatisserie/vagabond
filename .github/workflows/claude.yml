name: Claude Code
run-name: Agent review PR ${{ github.event.issue.number || github.event.pull_request.number }}
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
concurrency:
  group: agent-review-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read
  id-token: write
jobs:
  claude:
    if: contains(github.event.comment.body || github.event.review.body, '@claude review')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Admit explicit current-SHA request
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/agent-control/gate.cjs').run({github,context,core});
      - name: Checkout exact admitted PR for review (not for running gate)
        if: steps.gate.outputs.allow == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify review workspace
        if: steps.gate.outputs.allow == 'true'
        env:
          EXPECTED_HEAD: ${{ steps.gate.outputs.head }}
          EXPECTED_BASE: ${{ steps.gate.outputs.base }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git cat-file -e "$EXPECTED_BASE^{commit}"
          git diff --stat "$EXPECTED_BASE...$EXPECTED_HEAD"
      - name: ${{ steps.gate.outputs.execution }}
        if: steps.gate.outputs.allow == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'chatgpt-codex-connector[bot]'
          additional_permissions: |
            actions: read
          claude_args: '--model claude-opus-5 --effort high --max-turns 20'
          prompt: |
            Review PR ${{ github.event.issue.number || github.event.pull_request.number }} at head ${{ steps.gate.outputs.head }} and base ${{ steps.gate.outputs.base }}.
            Before reviewing, print git rev-parse HEAD, git rev-parse --verify origin/main, and git for-each-ref.
            Verify actual HEAD equals admitted head; otherwise stop and report blocked, never approve a different checkout.
            Use the explicit base...head diff. Verify both commits exist; missing refs are a blocker, not an empty diff.
            Do not run the full local test suite; inspect existing CI and report missing evidence.
            Read AGENTS.md, CLAUDE.md and docs/van-hanh-agent/van-hanh-chung.md.
            Read the triggering request for scope and previous reviewed SHA. Verify current head before publishing.
            Review independently, group actionable findings with reproduction and severity in one response.
            Do not change code, merge or deploy. Do not repeat full review when a delta is sufficient.
            If passed, conclude the exact SHA without tagging another bot. Only tag Codex for actionable new findings.
            If tools or evidence are unavailable, report the limitation rather than infer success.

# Issue287: đọc lại nguồn bền để cả comment từ GITHUB_TOKEN cũng được báo.
name: Telegram thong bao
on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, reopened, closed, ready_for_review, converted_to_draft, labeled, unlabeled]
  workflow_run:
    workflows: [Claude Code, Claude Code Review, Kiem thu truoc deploy, Bench tich hop SHA, Codex issue inbox]
    types: [completed]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      che_do:
        description: 'Khởi tạo chỉ một lần; đối soát dùng dấu đã lưu'
        type: choice
        options: [doi-soat, khoi-tao]
        default: doi-soat
permissions:
  contents: read
concurrency:
  group: telegram-doi-soat
  cancel-in-progress: false
jobs:
  gui:
    if: vars.TELEGRAM_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.che_do == 'khoi-tao')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      issues: read
      pull-requests: read
      actions: read
    steps:
      # Tuyệt đối không chạy code/checkout/cache/artifact của PR hoặc run kích hoạt.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/telegram
      - name: Đối soát và gửi thông báo
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHE_DO: ${{ inputs.che_do }}
        run: python3 .github/telegram/thong_bao.py

name: Bench tich hop SHA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: bench-only-password
          MARIADB_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Dung bench rieng va migrate hai luot
        env:
          VGB_BENCH: ${{ runner.temp }}/vgb-bench
          VGB_ARTIFACTS: ${{ runner.temp }}/vgb-bench-artifacts
        run: bash vagabond/khung/bench_thu/dung_ci.sh
      - name: Chay ca tich hop hai luot trong cung tien trinh
        env:
          VGB_BENCH: ${{ runner.temp }}/vgb-bench
          VGB_ARTIFACTS: ${{ runner.temp }}/vgb-bench-artifacts
        run: |
          set -o pipefail
          cd "$VGB_BENCH/sites"
          ../env/bin/python "$GITHUB_WORKSPACE/vagabond/khung/bench_thu/chay_ci.py" 2>&1 | tee "$VGB_ARTIFACTS/tich-hop.log"
      - name: Cai trinh duyet kiem staging
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Mo nam man va kiem doi ngay van don
        env:
          VGB_BENCH: ${{ runner.temp }}/vgb-bench
          VGB_ARTIFACTS: ${{ runner.temp }}/vgb-bench-artifacts
        run: bash vagabond/khung/staging/chay_web_ci.sh
      - name: Luu bang chung ke ca khi hong
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/vgb-bench-artifacts/
          if-no-files-found: error
          retention-days: 14

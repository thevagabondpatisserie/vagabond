<style>
#cmWrap{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#05323C}
#cmWrap h1{font-size:22px;font-weight:800;margin:0 0 4px;color:#05323C}
.cmSub{font-size:13.5px;color:#6b7280;margin:0 0 12px}
.cmChips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.cmChip{border:1px solid #cfd6dd;background:#fff;border-radius:999px;padding:7px 15px;font-size:13.5px;font-weight:600;color:#05323C;cursor:pointer}
.cmChip.on{background:#50DBF2;border-color:#50DBF2;color:#05323C;font-weight:800}
.cmBar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 8px}
.cmInp{border:1px solid #cfd6dd;border-radius:10px;padding:9px 13px;font-size:14px;min-width:270px;outline:0}
.cmInp:focus{border-color:#0FB5CE}
.cmLbl{font-size:13.5px;color:#6b7280}
.cmDate{border:1px solid #cfd6dd;border-radius:10px;padding:8px 11px;font-size:14px;outline:0}
.cmBtn{border:1px solid #cfd6dd;background:#fff;border-radius:10px;padding:9px 17px;font-size:14px;font-weight:700;color:#05323C;cursor:pointer}
.cmBtn.pri{background:#50DBF2;border-color:#50DBF2;font-weight:800}
.cmBtn:disabled{opacity:.5;cursor:default}
.cmCnt{font-size:13.5px;color:#6b7280}
.cmCnt b{color:#05323C}
.cmBar2{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 8px}
.cmTg{border:1px solid #cfd6dd;background:#fff;border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;color:#05323C;cursor:pointer}
.cmTg.on{background:#E4F9FD;border-color:#0FB5CE;color:#0B7C93;font-weight:800}
.cmNote{font-size:12.5px;color:#8a8f9c;margin:0 0 6px;line-height:1.5}
.cmSkip{font-size:12.5px;line-height:1.5;background:#fff4e0;color:#c07800;border-radius:10px;padding:9px 13px;margin:0 0 8px;display:none}
.cmSkip.show{display:block}
.cmSkip b{color:#8a5a00}
.cmImgN{font-size:12.5px;line-height:1.5;background:#eef6ff;color:#1d4e89;border-radius:10px;padding:9px 13px;margin:0 0 14px;display:none}
.cmImgN.show{display:block}
.cmImgN b{color:#0b355e}
#cmPages{margin:0 auto}
.cmPage{width:210mm;min-height:297mm;background:#fff;box-shadow:0 1px 10px rgba(0,0,0,.12);margin:0 auto 18px;padding:12mm 10mm;box-sizing:border-box;page-break-after:always}
.cmPh{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2px solid #05323C;padding-bottom:6px;margin-bottom:8px}
.cmPh .g{font-size:19px;font-weight:800;color:#05323C}
.cmPh .m{font-size:10.5px;color:#6b7280;text-align:right;line-height:1.5}
.cmGrid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #05323C;border-left:1px solid #05323C}
.cmGrid.c3{grid-template-columns:1fr 1fr 1fr}
.cmCell{border-right:1px solid #05323C;border-bottom:1px solid #05323C;padding:6px 8px 5px;min-height:32mm;display:flex;flex-direction:column;box-sizing:border-box}
.cmGrid.c3 .cmCell{padding:5px 6px 4px;min-height:30mm}
.cmNm{font-size:10.5px;font-weight:700;line-height:1.25;color:#05323C}
.cmGrid.c3 .cmNm{font-size:9.5px}
.cmUm{font-size:9px;color:#6b7280;margin-top:2px}
.cmBc{flex:1;display:flex;align-items:center;justify-content:center;padding:4px 0 2px}
.cmBc svg{width:100%;height:13mm}
.cmGrid.c3 .cmBc svg{height:11mm}
.cmCd{font-size:10.5px;font-weight:700;text-align:center;letter-spacing:1.4px;color:#05323C}
.cmGrid.c3 .cmCd{font-size:9.5px;letter-spacing:1.2px}
.cmEmp{text-align:center;color:#8a8f9c;font-size:14px;padding:40px 10px}
.cmGrid.img .cmCell{min-height:42mm;padding:5px 7px 4px}
.cmGrid.img.c3 .cmCell{min-height:36mm;padding:4px 5px 3px}
.cmTop2{display:flex;gap:6px;align-items:flex-start}
.cmPic{width:20mm;height:20mm;flex:0 0 20mm;border:1px solid #d7dee4;border-radius:3px;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center}
.cmGrid.c3 .cmPic{width:15mm;height:15mm;flex:0 0 15mm}
.cmPic img{width:100%;height:100%;object-fit:contain;display:block}
.cmPic.no{background:#f3f5f7;border-style:dashed;color:#a6afb8;font-size:7.5px;font-weight:700;text-align:center;line-height:1.2;padding:2px}
.cmTx{flex:1;min-width:0}
.cmGrid.img .cmBc{padding:3px 0 1px}
.cmGrid.img .cmBc svg{height:12mm}
.cmGrid.img.c3 .cmBc svg{height:10mm}
@media print{
 body{background:#fff !important}
 #cmTop,.navbar,.web-footer,footer,.page-header,header{display:none !important}
 .cmPage{box-shadow:none;margin:0;width:auto;min-height:auto;padding:0}
 .cmGrid{page-break-inside:auto}
 .cmCell{page-break-inside:avoid;break-inside:avoid}
 .cmPic,.cmPic img{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 @page{size:A4 portrait;margin:10mm}
}
</style>
<div id="cmWrap">
 <div id="cmTop">
  <h1>Cuốn mã vạch nguyên vật liệu</h1>
  <div class="cmSub">Chọn nhóm hàng cần in, bấm In cuốn, đóng thành tập cho bếp và kho quét nhanh khi làm phiếu yêu cầu mua hàng hoặc đi kiểm kê.</div>
  <div id="cmGrp" class="cmChips"></div>
  <div class="cmBar">
   <input id="cmQ" class="cmInp" placeholder="Lọc theo tên hoặc mã...">
   <span class="cmLbl">Chỉ hàng tạo từ ngày</span>
   <input id="cmFrom" type="date" class="cmDate">
   <button id="cmReload" class="cmBtn">Làm mới</button>
   <button id="cmPrint" class="cmBtn pri">In cuốn</button>
   <span id="cmCount" class="cmCnt"></span>
  </div>
  <div id="cmBcBar" class="cmBar2"></div>
  <div class="cmNote" id="cmNote"></div>
  <div id="cmSkip" class="cmSkip"></div>
  <div id="cmImgN" class="cmImgN"></div>
 </div>
 <div id="cmPages"></div>
</div>

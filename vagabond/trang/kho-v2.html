<style>
*{box-sizing:border-box} body{margin:0;background:#eef1f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#1f2933}
.v2-wrap{max-width:820px;margin:0 auto;padding-bottom:40px}
.v2-top{background:#67d5ea;color:#0c3b45;padding:14px 16px;font-weight:700;font-size:18px;text-align:center;position:sticky;top:0;z-index:5}
.v2-tabs{display:flex;gap:8px;padding:12px 12px 4px;overflow-x:auto}
.v2-tab{flex:0 0 auto;padding:8px 14px;border-radius:20px;background:#fff;border:1px solid #dfe4ea;font-size:14px;font-weight:600;color:#5c6670;cursor:pointer}
.v2-tab.on{background:#0c3b45;color:#fff;border-color:#0c3b45}
.v2-tab b{font-weight:700;margin-left:6px;opacity:.85}
.v2-search{margin:10px 12px}.v2-search input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #dfe4ea;font-size:15px;outline:none}
.v2-card{background:#fff;margin:10px 12px;border-radius:14px;padding:14px 16px;box-shadow:0 1px 3px rgba(16,24,40,.06);cursor:pointer}
.v2-r1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.v2-ncc{font-weight:700;font-size:15px;line-height:1.35}
.v2-meta{color:#7b8794;font-size:13px;margin-top:5px}
.v2-chip{flex:0 0 auto;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;white-space:nowrap}
.v2-day{color:#7b8794;font-size:12px;text-align:right;margin-top:6px}
.v2-empty{text-align:center;color:#98a2b3;padding:40px 20px;font-size:15px}
.v2-line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #e4e7ec;font-size:14px}
.v2-sheet{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;z-index:20}
.v2-sheet.on{display:block}
.v2-panel{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;padding:16px 18px 26px;max-height:80vh;overflow:auto}
.v2-close{float:right;color:#7b8794;font-size:22px;line-height:1;cursor:pointer}
</style>
<div class="v2-wrap">
  <div class="v2-top"><a href="/bep" style="float:left;color:#0c3b45;text-decoration:none;font-size:20px;line-height:1">&#8249;</a>Nhập kho <span style="font-weight:500;font-size:13px">(bản thử v2)</span></div>
  <div class="v2-tabs" id="v2tabs"></div>
  <div class="v2-search"><input id="v2q" placeholder="Tìm số phiếu hoặc nhà cung cấp"></div>
  <div id="v2list"></div>
</div>
<div class="v2-sheet" id="v2sheet"><div class="v2-panel" id="v2panel"></div></div>
<script>
(function(){
  var TABS=[{k:"cho",t:"Chờ nhận hàng",ds:0},{k:"xong",t:"Đã nhập kho",ds:1},{k:"huy",t:"Đã huỷ",ds:2}];
  var CHIP={cho:["#eceff2","#5c6670","Chờ nhận"],xong:["#d1f0dd","#0f5132","Đã nhập kho"],huy:["#fde2e1","#912018","Đã huỷ"]};
  var cur="cho", data={}, dem={};
  function api(dt,args){
    var u="/api/method/frappe.client.get_list?doctype="+encodeURIComponent(dt);
    for(var k in args){ u+="&"+k+"="+encodeURIComponent(typeof args[k]==="string"?args[k]:JSON.stringify(args[k])); }
    return fetch(u,{headers:{Accept:"application/json"}}).then(function(r){return r.json()}).then(function(j){return j.message||[]});
  }
  function ngay(s){ if(!s) return ""; var p=String(s).slice(0,10).split("-"); return p[2]+"/"+p[1]+"/"+p[0]; }
  function tai(k){
    var t=TABS.filter(function(x){return x.k===k})[0];
    var f=[["docstatus","=",t.ds]];
    if(t.ds===1) f.push(["posting_date",">=",new Date(Date.now()-7*864e5).toISOString().slice(0,10)]);
    if(t.ds===2) f.push(["posting_date",">=",new Date(Date.now()-30*864e5).toISOString().slice(0,10)]);
    return api("Purchase Receipt",{filters:f,fields:["name","supplier","posting_date","set_warehouse","total_qty"],limit_page_length:60,order_by:"modified desc"})
      .then(function(rows){
        data[k]=rows; dem[k]=rows.length;
        if(!rows.length) return rows;
        return api("Purchase Receipt Item",{parent:"Purchase Receipt",filters:[["parent","in",rows.map(function(x){return x.name})]],fields:["parent","item_code","item_name","qty","uom","warehouse"],limit_page_length:0})
          .then(function(it){ var m={}; it.forEach(function(x){ (m[x.parent]=m[x.parent]||[]).push(x); }); rows.forEach(function(r){ r._it=m[r.name]||[]; }); return rows; });
      });
  }
  function veTab(){
    document.getElementById("v2tabs").innerHTML = TABS.map(function(t){
      return "<div class=\"v2-tab"+(t.k===cur?" on":"")+"\" data-k=\""+t.k+"\">"+t.t+"<b>"+(dem[t.k]==null?"":dem[t.k])+"</b></div>";
    }).join("");
  }
  function veList(){
    var q=(document.getElementById("v2q").value||"").toLowerCase();
    var rows=(data[cur]||[]).filter(function(r){ return !q || (r.name+" "+(r.supplier||"")).toLowerCase().indexOf(q)>=0; });
    var c=CHIP[cur];
    document.getElementById("v2list").innerHTML = rows.length? rows.map(function(r){
      return "<div class=\"v2-card\" data-n=\""+r.name+"\">"+
        "<div class=\"v2-r1\"><div><div class=\"v2-ncc\">"+(r.supplier||"-")+"</div>"+
        "<div class=\"v2-meta\">"+r.name+" · "+((r._it||[]).length)+" món · "+((r.set_warehouse||(r._it&&r._it[0]&&r._it[0].warehouse)||"").replace(" - TV",""))+"</div></div>"+
        "<div style=\"text-align:right\"><span class=\"v2-chip\" style=\"background:"+c[0]+";color:"+c[1]+"\">"+c[2]+"</span>"+
        "<div class=\"v2-day\">"+ngay(r.posting_date)+"</div></div></div></div>";
    }).join("") : "<div class=\"v2-empty\">Không có phiếu nào</div>";
  }
  function moChiTiet(n){
    var r=(data[cur]||[]).filter(function(x){return x.name===n})[0]; if(!r) return;
    document.getElementById("v2panel").innerHTML = "<span class=\"v2-close\" id=\"v2x\">×</span>"+
      "<div style=\"font-weight:700;font-size:16px\">"+(r.supplier||"")+"</div>"+
      "<div class=\"v2-meta\" style=\"margin-bottom:10px\">"+r.name+" · "+ngay(r.posting_date)+"</div>"+
      (r._it||[]).map(function(i){ return "<div class=\"v2-line\"><div>"+(i.item_name||i.item_code)+"</div><div style=\"font-weight:600;white-space:nowrap\">"+i.qty+" "+(i.uom||"")+"</div></div>"; }).join("");
    document.getElementById("v2sheet").classList.add("on");
  }
  document.addEventListener("click",function(e){
    var t=e.target.closest(".v2-tab"); if(t){ cur=t.getAttribute("data-k"); veTab(); veList(); if(!data[cur]) tai(cur).then(function(){veTab();veList();}); return; }
    var c=e.target.closest(".v2-card"); if(c){ moChiTiet(c.getAttribute("data-n")); return; }
    if(e.target.id==="v2x" || e.target.id==="v2sheet"){ document.getElementById("v2sheet").classList.remove("on"); }
  });
  document.addEventListener("input",function(e){ if(e.target.id==="v2q") veList(); });
  veTab();
  Promise.all(TABS.map(function(t){return tai(t.k)})).then(function(){ veTab(); veList(); });
})();
</script>

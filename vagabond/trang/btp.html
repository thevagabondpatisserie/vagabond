<style>
/* BTP banh o - giao dien SANG dong bo voi app /bep va /kiem-banh (01/08) */
body{background:#eef1f5}
#bt{max-width:760px;margin:0 auto;padding:14px 12px 60px;color:#1f2937;font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
#bt .bt-back{display:inline-block;font-size:12px;color:#6b7280;text-decoration:none;margin-bottom:4px}
#bt .bt-back:hover{color:#0d9488}
#bt h1{font-size:20px;font-weight:700;color:#111827;margin:4px 0 2px}
#bt .bt-phu{font-size:12px;color:#6b7280;margin-bottom:10px}
#bt .bt-nut{display:flex;gap:8px;margin:10px 0 14px;flex-wrap:wrap}
#bt .bt-nut button{flex:1;min-width:120px;background:#fff;border:1px solid #d1d5db;color:#0d9488;padding:12px 8px;font-size:13px;font-weight:600;border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
#bt .bt-nut button:active{background:#f3f4f6}
#bt #bt-bao{min-height:18px;font-size:12px;color:#0d9488;margin-bottom:8px}
#bt #bt-bao.loi{color:#dc2626}
#bt .bt-the{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(16,24,40,.08);margin-bottom:10px;overflow:hidden}
#bt .bt-ten{padding:10px 12px 8px;border-bottom:1px solid #f1f3f5;display:flex;align-items:center;gap:10px}
#bt .bt-ten img{width:40px;height:40px;object-fit:cover;flex:none;border-radius:8px;border:1px solid #e5e7eb}
#bt .bt-noimg{width:40px;height:40px;flex:none;border-radius:8px;border:1px dashed #d1d5db;background:#f9fafb}
#bt .bt-ten b{color:#1d4ed8;font-size:12.5px;letter-spacing:.03em}
#bt .bt-ten span{font-size:13px;color:#374151}
#bt .bt-so{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
#bt .bt-o{padding:9px 2px 10px;border-right:1px solid #f1f3f5}
#bt .bt-o:last-child{border-right:0}
#bt .bt-o label{display:block;font-size:9px;color:#6b7280;letter-spacing:.03em;margin-bottom:3px;text-transform:uppercase;font-weight:600}
#bt .bt-o b{font-size:17px;font-weight:600;color:#111827}
#bt .bt-o.sua b{color:#0d9488;border-bottom:1px dashed #99d5cf;padding:0 6px;cursor:pointer}
#bt .bt-o.dang input{width:64px;background:#fff;border:1.5px solid #0d9488;border-radius:6px;color:#111827;font-size:17px;text-align:center;padding:2px 0}
#bt .bt-nhan{background:#f8fafc}
#bt .bt-nhan b{color:#9ca3af}
#bt .bt-nhan.duong b{color:#059669;font-size:19px}
#bt .bt-nhan.am b{color:#dc2626;font-size:19px}
#bt .bt-trong{background:#fff;border:1px dashed #d1d5db;border-radius:12px;padding:22px 14px;font-size:13px;color:#6b7280;line-height:1.6;text-align:center}
/* Khung mac dinh cua Web Page Frappe - an cho dong bo voi app */
header,.navbar,.web-footer,footer{display:none!important}
.page_content,.page-content-wrapper{padding-top:0!important}
</style>
<div id="bt">
  <a class="bt-back" href="/bep">&#8249; Màn hình nghiệp vụ</a>
  <h1>BTP bánh ổ</h1>
  <div class="bt-phu">Bếp dự trù bánh chờ finish cho 2-3 ngày · <span id="bt-luc"></span></div>
  <div class="bt-nut">
    <button id="bt-them">Thêm mã</button>
    <button id="bt-gieo">Đổ mã từ bảng kiểm</button>
  </div>
  <div id="bt-bao"></div>
  <div id="bt-luoi"></div>
</div>

<!DOCTYPE html>
<!-- Man hinh phu quay ra phia khach tai quay (anh Viet chot 20/08/2026).

     TRANG NAY KHONG GOI MOT API NAO. Toan bo du lieu den tu tab tinh tien
     qua BroadcastChannel. Ly do: neu no goi API ma phien dang nhap het han
     thi Frappe da ra form dang nhap, va cai form do se nam chan giua man
     hinh ngay truoc mat khach. No chi la cai ti vi, khong phai mot phien
     lam viec. Vi vay trang nay cung khong can dang nhap, va khong biet gi
     ve co so du lieu.

     Cai gi duoc bay len day do 25-man-hinh-khach.js quyet dinh. Man hinh
     nay quay ra cho dong nguoi qua lai nen khong bao gio bay so dien
     thoai, ma khach, hang the, diem tich luy hay cong no.

     Keo cua so nay sang man hinh phu roi bam nut mo rong la xong. -->
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Vagabond</title>
<style>
/* MAU THUONG HIEU (anh Viet 26/08/2026): *"Nen mau xanh robin egg cua
   thuong hieu, them logo nua"*.

   Hai ma nay lay dung tu thanh dau cua app nghiep vu (bien CSS trong
   00-nen.js), khong tu che ma moi: man hinh khach dat ngay canh may tinh
   thu ngan nen hai cai phai cung mot mau, lech mot chut la nhin ra ngay.

   Nen sang thi chu phai dam va phai nam tren the trang, khong duoc do chu
   nhat mau len nen nhat mau. */
:root {
  --nen: #50DBF2;
  --muc: #05323C;
  --the: #ffffff;
  --nhat: rgba(5, 50, 60, .55);
  --vien: rgba(5, 50, 60, .12);
  --xanh: #067a5f;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: var(--nen); color: var(--muc); overflow: hidden;
  -webkit-user-select: none; user-select: none;
}
#man { height: 100%; display: flex; flex-direction: column; }
.giua { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 4vh 4vw; }

.dau { padding: 2.2vh 3vw; display: flex; align-items: center; gap: 16px; }
.dau img { height: clamp(38px, 4.6vw, 62px); width: auto; display: block; }
.dau b { font-size: clamp(16px, 1.8vw, 23px); letter-spacing: .3px; display: block; }
.dau span { font-size: clamp(11px, 1.15vw, 15px); color: var(--nhat); }

.than { flex: 1; display: flex; min-height: 0; gap: 2vw; padding: 0 3vw 3vh; }
.trai, .phai {
  background: var(--the); border-radius: 22px; padding: 2.6vh 2.4vw;
  box-shadow: 0 10px 30px rgba(5, 50, 60, .12);
  display: flex; flex-direction: column; min-width: 0;
}
.trai { flex: 1.15; }
.phai { flex: 1; align-items: center; justify-content: center; }

.nhan { font-size: clamp(11px, 1.1vw, 15px); color: var(--nhat); letter-spacing: 1.4px; text-transform: uppercase; margin-bottom: 1.4vh; }
#dsMon { flex: 1; overflow: hidden; align-content: start; }

/* MOT DONG MON = ANH + TEN + SO LUONG + TIEN (anh Viet 01/09/2026).

   Anh mon la thu khach nhan ra nhanh nhat: dung xep hang liec mot cai la
   biet thu ngan dang bam dung mon minh goi chua, khong phai doc chu. Nen
   anh di truoc, va di o kich thuoc doc duoc tu hai met.

   Mon khong co anh thi de mot o tron mau nhat mang chu cai dau, chu khong
   de khoang trong: mot dong thut vao giua danh sach nhin ra ngay. */
.mon { display: flex; align-items: center; gap: clamp(10px, 1.2vw, 18px); padding: 1.25vh 0; border-bottom: 1px solid var(--vien); font-size: clamp(15px, 1.7vw, 23px); }
.mon:last-child { border-bottom: none; }
.mon .anh {
  flex: none; width: clamp(44px, 4.6vw, 76px); aspect-ratio: 1; border-radius: 14px;
  object-fit: cover; background: rgba(5, 50, 60, .06); display: block;
}
.mon .chu {
  flex: none; width: clamp(44px, 4.6vw, 76px); aspect-ratio: 1; border-radius: 14px;
  background: rgba(5, 50, 60, .06); color: var(--nhat);
  display: flex; align-items: center; justify-content: center;
  font-size: clamp(18px, 2vw, 30px); font-weight: 800;
}
.mon .ten { flex: 1; min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.28; }
.mon .sl { flex: none; font-weight: 800; color: var(--nhat); white-space: nowrap; }
.mon .tien { flex: none; font-weight: 700; white-space: nowrap; min-width: 4.2em; text-align: right; }
.them { padding: 1.2vh 0 0; font-size: clamp(12px, 1.2vw, 17px); color: var(--nhat); }
.cong { padding-top: 1.8vh; }
.dong { display: flex; justify-content: space-between; font-size: clamp(13px, 1.3vw, 18px); color: var(--nhat); padding: .5vh 0; }
.tong { display: flex; justify-content: space-between; align-items: baseline; margin-top: 1vh; border-top: 2px solid var(--muc); padding-top: 1.2vh; }
.tong span { font-size: clamp(14px, 1.5vw, 20px); color: var(--nhat); }
.tong b { font-size: clamp(30px, 4.4vw, 62px); letter-spacing: -1px; }

/* Ma QR khong duoc bo them vien mau: may quet doc bang do tuong phan, va
   vung trang quanh ma la mot phan cua ma. */
#qrAnh { width: min(40vh, 88%); aspect-ratio: 1; background: #fff; border-radius: 12px; display: block; }
.qrTien { font-size: clamp(24px, 3.2vw, 46px); font-weight: 800; margin-top: 2vh; }
/* So tien nam TREN ma QR chu khong duoi: khach cam dien thoai len la mat
   nhin thang vao ma, doc so tien truoc khi quet moi yen tam. */
.qrDau { font-size: clamp(13px, 1.35vw, 19px); color: var(--nhat); margin-bottom: 1.6vh; text-align: center; }
.qrDau b { display: block; font-size: clamp(28px, 3.6vw, 52px); color: var(--muc); letter-spacing: -1px; margin-top: .3vh; }
.qrNd { font-size: clamp(12px, 1.2vw, 17px); color: var(--nhat); margin-top: .6vh; text-align: center; }
.qrTk { font-size: clamp(11px, 1.05vw, 15px); color: var(--nhat); margin-top: .4vh; text-align: center; }
.xanh { color: var(--xanh); }

.chao h1 { font-size: clamp(34px, 5.6vw, 84px); letter-spacing: -1px; }
.chao p { font-size: clamp(14px, 1.7vw, 24px); color: var(--nhat); margin-top: 1.6vh; }
.chao img { height: clamp(90px, 12vw, 190px); width: auto; margin-bottom: 3.4vh; }
.to { font-size: clamp(40px, 7vw, 110px); }

#nutTo {
  position: fixed; right: 14px; bottom: 14px; z-index: 9;
  background: rgba(255, 255, 255, .8); color: var(--muc); border: 1px solid var(--vien);
  border-radius: 10px; padding: 8px 13px; font-size: 13px; cursor: pointer; opacity: .3;
}
#nutTo:hover { opacity: 1; }
</style>
</head>
<body>
<div id="man"></div>
<button id="nutTo" type="button">Toàn màn hình</button>
<script>
(function () {
  'use strict';

  var KENH = 'vagabond-cfd';
  var GT = 1;
  /* Chin muoi giay khong nghe gi thi ve man chao. Tab tinh tien phat nhip
     ba giay mot lan, nen im chin muoi giay nghia la no da dong, may da tat,
     hay mat mang. Khong duoc de so tien cua khach truoc nam lai tren man. */
  var HET_HAN = 90000;
  /* Loi cam on giu tam giay roi ve man chao. */
  var CAM_ON_GIU = 8000;
  /* Logo tren nen xanh. Uu tien tep logo nen trong da tai len site (cung
     tep dung cho ban in), thieu thi ro ve bieu tuong app. Khong goi API de
     hoi duong dan: trang nay khong duoc phep goi API, xem dau tep. */
  var LOGO = '/files/logo-in.png';
  var LOGO_DU = '/assets/vagabond/pwa/icon-192.png';
  function theLogo(lop) {
    return '<img' + (lop ? ' class="' + lop + '"' : '') + ' src="' + LOGO +
      '" alt="The Vagabond Patisserie" onerror="this.onerror=null;this.src=\'' + LOGO_DU + '\'">';
  }

  var man = document.getElementById('man');
  var goi = null;        /* goi tin dang ve */
  var nhanLuc = 0;       /* luc nhan goi gan nhat */
  var tabNghe = '';      /* dang bam theo tab tinh tien nao */
  var kenh = null;

  function so(v) {
    var n = Math.round(Number(v) || 0);
    return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }

  function ch(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function veChao() {
    man.innerHTML =
      '<div class="giua"><div class="chao">' +
      theLogo() +
      '<h1>The Vagabond Pâtisserie</h1>' +
      '<p>Kính chào quý khách</p>' +
      '</div></div>';
  }

  function veCamOn(g) {
    man.innerHTML =
      '<div class="giua"><div class="chao">' +
      '<div class="to">✅</div>' +
      '<h1 class="xanh">Cảm ơn quý khách</h1>' +
      '<p>' + (g && g.tra ? 'Đã thanh toán ' + so(g.tra) + ' đ. ' : '') + 'Hẹn gặp lại</p>' +
      '</div></div>';
  }

  function veDon(g) {
    /* Chi bay so dong VUA DU man, phan con lai gop thanh mot dong dem.
       Danh sach dai hon man hinh thi truoc day bi cat cut o giua, khach
       nhin thay mot dong bi xen doi. */
    var cac = g.mon || [];
    var TRAN = 6;
    var hien = cac.slice(0, TRAN);
    var mon = hien.map(function (m) {
      var ten = ch(m.ten);
      var o = m.anh
        ? '<img class="anh" src="' + ch(m.anh) + '" alt="" ' +
          'onerror="this.outerHTML=&quot;<span class=\'chu\'>' + ch((m.ten || '?').trim().charAt(0).toUpperCase()) + '</span>&quot;">'
        : '<span class="chu">' + ch((m.ten || '?').trim().charAt(0).toUpperCase()) + '</span>';
      return '<div class="mon">' + o +
        '<span class="ten">' + ten + '</span>' +
        '<span class="sl">×' + so(m.sl) + '</span>' +
        '<span class="tien">' + so(m.tien) + '</span></div>';
    }).join('');
    if (cac.length > TRAN) {
      var conLai = cac.slice(TRAN).reduce(function (t, m) { return t + (Number(m.sl) || 0); }, 0);
      mon += '<div class="them">và ' + so(conLai) + ' món nữa</div>';
    }

    var phai;
    if (g.qr && g.qr.du) {
      phai = '<div style="text-align:center">' +
        '<div class="to">✅</div>' +
        '<div class="qrTien xanh">Đã nhận ' + so(g.qr.nhan) + ' đ</div>' +
        '<div class="qrNd">Cảm ơn quý khách, thu ngân đang hoàn tất hoá đơn</div></div>';
    } else if (g.qr) {
      phai = '<div class="qrDau">Quét mã để chuyển khoản<b>' + so(g.tra) + ' đ</b></div>' +
        '<img id="qrAnh" src="' + ch(g.qr.url) + '" alt="Mã QR chuyển khoản">' +
        '<div class="qrNd">Nội dung <b>' + ch(g.qr.nd) + '</b> đã điền sẵn trong mã</div>' +
        '<div class="qrTk">' + ch(g.qr.ten) + '<br>' + ch(g.qr.bank + ' ' + g.qr.stk) + '</div>';
    } else {
      phai = '<div style="text-align:center">' +
        '<div class="nhan">Thanh toán</div>' +
        '<div class="qrTien">' + ch(g.pt || 'Tại quầy') + '</div>' +
        '<div class="qrNd">Mời quý khách thanh toán tại quầy</div></div>';
    }

    man.innerHTML =
      /* Logo da mang ten tiem roi, nen canh no chi de ten diem ban. Truoc
         day viet lai "The Vagabond Patisserie" mot lan nua ngay canh logo,
         doc thanh hai lan cung mot cau. */
      '<div class="dau">' + theLogo() +
      '<div><span>Kính chào quý khách</span><br><b>' + ch(g.quay || '') + '</b></div></div>' +
      '<div class="than">' +
      '<div class="trai"><div class="nhan">Đơn của quý khách</div>' +
      '<div id="dsMon">' + mon + '</div>' +
      '<div class="cong">' +
      (g.giam > 0 ? '<div class="dong"><span>Tạm tính</span><span>' + so(g.tong) + ' đ</span></div>' +
        '<div class="dong"><span>Giảm giá</span><span class="xanh">&minus;' + so(g.giam) + ' đ</span></div>' : '') +
      '<div class="tong"><span>Tổng cộng</span><b>' + so(g.tra) + ' đ</b></div>' +
      '</div></div>' +
      '<div class="phai">' + phai + '</div>' +
      '</div>';
  }

  function ve() {
    if (!goi || goi.man === 'chao') return veChao();
    if (goi.man === 'cam_on') return veCamOn(goi);
    veDon(goi);
  }

  function nhan(m) {
    if (!m || m.gt !== GT || m.loai !== 'trang_thai') return;
    /* Hai tab tinh tien cung mo thi bam theo mot tab thoi, khong nhay qua
       nhay lai. Tab dang nghe im qua lau thi moi nhuong cho tab khac. */
    var im = Date.now() - nhanLuc;
    if (tabNghe && m.tab !== tabNghe && im < HET_HAN) return;
    tabNghe = m.tab || '';
    nhanLuc = Date.now();
    goi = m;
    ve();
    /* Bao nguoc lai cho man tinh tien biet man hinh khach dang bat that.
       Thu ngan nhin chip do, khong phai doan. */
    try { kenh.postMessage({ gt: GT, loai: 'song', luc: nhanLuc }); } catch (e) { }
    if (m.man === 'cam_on') {
      setTimeout(function () {
        if (goi && goi.man === 'cam_on') { goi = null; ve(); }
      }, CAM_ON_GIU);
    }
  }

  try {
    kenh = new BroadcastChannel(KENH);
  } catch (e) {
    man.innerHTML = '<div class="giua"><div class="chao"><div class="to">🖥</div>' +
      '<h1>Chưa dùng được</h1>' +
      '<p>Trình duyệt này không có BroadcastChannel. Dùng Chrome hoặc Safari bản mới.</p>' +
      '</div></div>';
    return;
  }

  kenh.onmessage = function (e) { nhan(e && e.data); };

  veChao();

  /* CHE DO THU: mo /man-hinh-khach?thu=1 la ra don mau.

     De ai cung kiem duoc man hinh phu ma khong can mot thu ngan ngoi bam
     bill that. Cam mot cai may tinh ra quay, mo dia chi nay, keo sang man
     phu, nhin mot cai la biet man hinh do dang o che do Extend hay
     Duplicate, chu co dung mau va anh mon co len khong.

     Don mau KHONG chua mot o rieng tu nao, dung y het don that. */
  if (/(^|[?&])thu=1(&|$)/.test(location.search)) {
    goi = {
      gt: GT, loai: 'trang_thai', tab: 'THU', luc: Date.now(), man: 'don',
      quay: 'Thử màn hình',
      mon: [
        /* Ba mon that trong danh muc, de thay ca anh len that hay khong.
           Tep anh bi doi ten hay xoa thi o anh tu roi ve chu cai dau, nen
           man thu khong bao gio vo. */
        { ten: 'Bánh Solitude', sl: 1, tien: 160000, anh: '/files/20260818-104355.jpg' },
        { ten: 'Bánh Mead', sl: 2, tien: 340000, anh: '/files/sp-baen00078.png' },
        { ten: 'Bánh Bánh Khúc', sl: 1, tien: 165000, anh: '/files/20260818-103831.jpg' }
      ],
      tong: 665000, giam: 50000, tra: 615000, pt: 'Chuyển khoản',
      qr: {
        url: 'https://img.vietqr.io/image/MB-VQRQALEAF2999-qr_only.png?amount=615000&addInfo=TCVAVQW5',
        nd: 'TCVAVQW5', ten: 'PATISSERIE VAGABOND COMPANY LIMITED',
        bank: 'MB', stk: 'VQRQALEAF2999', nhan: 0, du: false
      }
    };
    nhanLuc = Date.now();
    ve();
    return;
  }

  /* BroadcastChannel khong luu tin cu: mo man hinh nay sau khi thu ngan da
     bam vai mon thi khong nhan duoc gi. Nen xin mot lan luc mo, va xin lai
     vai lan dau phong khi tab tinh tien dang ban. */
  function xin() { try { kenh.postMessage({ gt: GT, loai: 'xin' }); } catch (e) { } }
  xin();
  var conXin = 5;
  var henXin = setInterval(function () {
    if (nhanLuc || conXin-- <= 0) return clearInterval(henXin);
    xin();
  }, 1500);

  /* Canh gac: het han khong nghe nhip thi ve man chao. */
  setInterval(function () {
    if (!nhanLuc) return;
    if (Date.now() - nhanLuc < HET_HAN) return;
    nhanLuc = 0; tabNghe = ''; goi = null;
    ve();
  }, 1000);

  var nutTo = document.getElementById('nutTo');
  nutTo.onclick = function () {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    } catch (e) { }
  };
})();
</script>
</body>
</html>
